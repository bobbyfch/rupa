name: Sync offline index (metadata only)
# Refreshes the game and anime title indexes from their public upstreams and opens a pull request.
# It never downloads or commits artwork images, and it uses no provider key.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/ingest/games.mjs
      - run: node scripts/ingest/anime.mjs
      - run: node scripts/ingest/build-catalog.mjs
      - run: node scripts/ingest/verify.mjs
      - name: Open pull request when the index changed
        run: |
          if git diff --quiet -- public/offline/index data/provenance; then echo "No upstream change."; exit 0; fi
          branch="sync/offline-index-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/offline/index data/provenance
          git commit -m "Refresh offline title index"
          git push origin "$branch"
          gh pr create --title "Refresh offline title index" --body "Automated metadata-only refresh. Review upstream revisions in data/provenance/rights-ledger.json. No images were added." --base main --head "$branch"
