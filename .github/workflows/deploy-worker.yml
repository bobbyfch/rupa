name: Deploy Rupa API Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if (( \${#missing[@]} )); then
            printf '::error::Add these repository Actions secrets before deploying: %s\n' "\${missing[*]}"
            exit 1
          fi
      - name: Deploy the Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npm run deploy:worker 2>&1)" || { status=$?; printf '%s\n' "$output"; exit "$status"; }
          printf '%s\n' "$output"
          worker_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1 || true)"
          if [[ -z "$worker_url" ]]; then
            printf '::error::Could not find the Worker workers.dev URL in the Wrangler deploy output.\n'
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Rebuild Pages with the Worker URL
        env:
          GH_TOKEN: \${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --field worker_url="\${{ steps.deploy.outputs.worker_url }}"
      - name: Summarize deployment
        env:
          WORKER_URL: \${{ steps.deploy.outputs.worker_url }}
        run: |
          {
            echo "## Worker deployed"
            echo
            echo "Worker: $WORKER_URL"
            echo
            echo "A Pages build was dispatched with this Worker URL."
          } >> "$GITHUB_STEP_SUMMARY"
