name: Refresh Steam charts and game artwork references
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: steam-game-artwork-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm run refresh:game-trends
      - name: Publish changed references and deploy Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- public/data/games-trending.json public/offline/index/games-steam.json; then echo "No game references changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/games-trending.json public/offline/index/games-steam.json
          git commit -m "Refresh Steam artwork references"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
