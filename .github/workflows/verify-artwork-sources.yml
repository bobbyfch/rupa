name: Verify artwork data
on:
  pull_request:
    branches: [main]
    paths: ['data/**', 'public/offline/**', 'scripts/**', 'worker/**', 'src/lib/catalog.ts', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fails on: missing/oversized/hash-mismatched assets, non-mirrorable licenses, missing attribution,
      # unsafe index hosts, and any reference to a keyed provider credential.
      - run: node scripts/ingest/verify.mjs
